[project]
name = "ti-dash"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiosqlite>=0.22.1",
    "datastar-py>=1.0.2",
    "htpy>=26.5.1",
    "litestar>=2.24.0",
    "uvicorn>=0.51.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]  
asyncio_mode = "auto"
